<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crisis Mate | Simplified</title>
  <meta name="description" content="Crisis Mate — The world's most advanced real-time crisis response network. Predictive disaster modeling meets elite rescue coordination." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  "#eef2ff",
              100: "#e0e7ff",
              200: "#c7d2fe",
              300: "#a5b4fc",
              400: "#818cf8",
              500: "#6366f1",
              600: "#4f46e5",
              700: "#4338ca",
              800: "#3730a3",
              900: "#312e81",
            },
            surface: {
              0:   "#ffffff",
              50:  "#f8fafc",
              100: "#f1f5f9",
              200: "#e2e8f0",
              300: "#cbd5e1",
            },
            ink: {
              900: "#0f172a",
              800: "#1e293b",
              700: "#334155",
              500: "#64748b",
              400: "#94a3b8",
              300: "#cbd5e1",
            },
            danger: "#ef4444",
            success: "#22c55e",
            warning: "#f59e0b",
          },
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
          },
          boxShadow: {
            "soft":    "0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06)",
            "lifted":  "0 4px 14px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04)",
            "card":    "0 8px 30px rgba(0,0,0,0.06)",
            "glow":    "0 0 30px rgba(99,102,241,0.15)",
          },
          borderRadius: {
            "2xl": "1rem",
            "3xl": "1.25rem",
          },
        },
      },
    };
  </script>

  <!-- Global theme stylesheet -->
  <link rel="stylesheet" href="/src/theme/index.css" />
</head>

<body class="bg-white text-ink-900 font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
